# Configuração de exemplo do Nginx para PestControl Pro
# Copie para /etc/nginx/sites-available/pestcontrol
# Crie link simbólico: sudo ln -s /etc/nginx/sites-available/pestcontrol /etc/nginx/sites-enabled/

# Redireciona HTTP para HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name pestcontrol.example.com www.pestcontrol.example.com;
    
    # Redireciona todo tráfego HTTP para HTTPS
    return 301 https://$server_name$request_uri;
}

# Servidor HTTPS principal
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name pestcontrol.example.com www.pestcontrol.example.com;
    
    # === Certificados SSL ===
    # Substitua pelos caminhos dos seus certificados
    # Para obter certificado gratuito, use: sudo certbot --nginx -d pestcontrol.example.com
    ssl_certificate /etc/letsencrypt/live/pestcontrol.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pestcontrol.example.com/privkey.pem;
    
    # Configurações SSL seguras
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    
    # === Cabeçalhos de Segurança ===
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # === Logs ===
    access_log /var/log/nginx/pestcontrol_access.log;
    error_log /var/log/nginx/pestcontrol_error.log warn;
    
    # === Configurações de Upload ===
    client_max_body_size 10M;
    client_body_timeout 60s;
    
    # === Compressão Gzip ===
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;
    
    # === Cache de Arquivos Estáticos ===
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://localhost:3210;
        proxy_cache_valid 200 30d;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    
    # === Proxy para a aplicação Node.js ===
    location / {
        proxy_pass http://localhost:3210;
        proxy_http_version 1.1;
        
        # Headers para proxy reverso
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Cache bypass
        proxy_cache_bypass $http_upgrade;
    }
    
    # === Healthcheck endpoint ===
    location /health {
        proxy_pass http://localhost:3210/health;
        access_log off;
    }
    
    # === Rate limiting para APIs ===
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://localhost:3210;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# === Rate Limiting ===
# Adicione no bloco http do nginx.conf
# limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
